function pickPhoto() {

    const i = h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none' });
    i.addEventListener('change', () => { res(i.files && i.files[0] ? i.files[0] : null); i.remove(); });
    i.addEventListener('cancel', () => { res(null); i.remove(); });
    document.body.append(i); i.click();

async function toCanvas(file, maxSide) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
function canvasBlob(c, withStamp) {
  let src = c;
  if (withStamp) {
    src = document.createElement('canvas'); src.width = c.width; src.height = c.height;
    const x = src.getContext('2d'); x.drawImage(c, 0, 0);
    const fs = Math.max(16, Math.round(c.width / 48));
    x.font = fs + 'px sans-serif';
    const t = fmt(new Date().toISOString());
    const tw = x.measureText(t).width;
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, c.height - fs * 1.7, tw + fs * 1.2, fs * 1.7);
    x.fillStyle = '#fff'; x.fillText(t, fs * .6, c.height - fs * .5);
  }
  return new Promise((res) => src.toBlob(res, 'image/jpeg', 0.72));
}
async function prepPhoto(file) {
  const c = await toCanvas(file, 1600);
  return { canvas: c, blob: await canvasBlob(c, true) };
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Libreria non disponibile (serve internet la prima volta).'));
    document.head.append(s);
  });
}
function pickVin(text) {
  const lines = (text || '').toUpperCase().split(/\n/).map((s) => s.replace(/[^A-Z0-9]/g, ''));
  const joined = lines.join('');
  const re = /[A-HJ-NPR-Z0-9]{17}/;
  for (const l of lines) { const m = l.match(re); if (m) return m[0]; }
  const m2 = joined.match(re); if (m2) return m2[0];
  const best = lines.sort((a, b) => b.length - a.length)[0] || '';
  return best.length >= 9 ? best.slice(0, 17) : '';
}
async function readVin(canvas) {
  if (!window.Tesseract) await loadScript(CFG.TESS);
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.6)'; x.drawImage(canvas, 0, 0);
  const w = await Tesseract.createWorker('eng');
  try {
    await w.setParameters({ tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789', tessedit_pageseg_mode: '11' });
    const r = await Promise.race([w.recognize(c), new Promise((_, rej) => setTimeout(() => rej(new Error('tempo scaduto')), 60000))]);
    return pickVin(r.data.text);
  } finally { try { await w.terminate(); } catch (e) { /* niente */ } }
}

/* ---------- visualizzazione foto ---------- */
const urlCache = new Map();
async function photoBlob(p) {
  if (p.blob) return p.blob;
  const c = await dbGet('pcache', p.id); if (c) return c.blob;
  if (!navigator.onLine) throw new Error('offline');
  const j = await api('/storage/v1/object/sign/' + CFG.BUCKET + '/' + p.path, { method: 'POST', body: { expiresIn: 600 } });
  const u = j.signedURL.indexOf('/storage/v1') === 0 ? j.signedURL : '/storage/v1' + j.signedURL;
  const r = await fetch(CFG.URL + u);
  if (!r.ok) throw new Error('foto ' + r.status);
  const b = await r.blob();
  await dbPut('pcache', { id: p.id, blob: b });
  return b;
}
async function photoURL(p) {
  if (urlCache.has(p.id)) return urlCache.get(p.id);
  const u = URL.createObjectURL(await photoBlob(p));
  urlCache.set(p.id, u);
  return u;
}
function thumb(p, label, onTap) {

  const box = h('button', { class: 'ph', type: 'button', onclick: onTap }, img, label ? h('span', { class: 'phl' }, label) : null, p._dirty ? h('span', { class: 'phd', title: 'Da inviare' }) : null);
  photoURL(p).then((u) => { img.src = u; }).catch(() => { box.classList.add('off'); box.prepend(h('span', { class: 'phx' }, 'Foto non disponibile offline')); });
  return box;
}

/* ---------- sincronizzazione ---------- */
const SYNC = { busy: false, err: '', last: 0 };
const pending = () => S.queue.length + TABLES.reduce((n, t) => n + S[t].filter((r) => r._dirty).length, 0);
async function pushAll() {
  for (const q of S.queue.slice()) {
    if (q.paths && q.paths.length) await api('/storage/v1/object/' + CFG.BUCKET, { method: 'DELETE', body: { prefixes: q.paths } });
    await api('/rest/v1/' + q.table + '?id=eq.' + q.rowId, { method: 'DELETE' });
    await dbDel('queue', q.id);
  }
  await reload('queue');
  for (const t of ['bolle', 'cars', 'damages']) {
    const rows = (await dbAll(t)).filter((r) => r._dirty);
    if (!rows.length) continue;
    await api('/rest/v1/' + t + '?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: rows.map((r) => pick(t, r)) });
    for (const r of rows) { const cur = await dbGet(t, r.id); if (cur && cur._rev === r._rev) { delete cur._dirty; await dbPut(t, cur); } }
  }
  for (const p of (await dbAll('photos')).filter((x) => x._dirty)) {
    if (p.blob && !p._up) {
      await api('/storage/v1/object/' + CFG.BUCKET + '/' + p.path, { method: 'POST', body: p.blob, headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' } });
      const c1 = await dbGet('photos', p.id); if (c1) { c1._up = 1; await dbPut('photos', c1); }
    }
    await api('/rest/v1/photos?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [pick('photos', p)] });
    const c2 = await dbGet('photos', p.id); if (c2 && c2._rev === p._rev) { delete c2._dirty; await dbPut('photos', c2); }
  }
}
async function pullAll() {
  for (const t of TABLES) {
    let rows = [], off = 0;
    for (;;) {
      const part = await api('/rest/v1/' + t + '?select=*&order=created_at.asc&limit=1000&offset=' + off);
      rows = rows.concat(part); if (part.length < 1000) break; off += 1000;
    }
    const ids = new Set(rows.map((r) => r.id));
    for (const r of rows) {
      const loc = await dbGet(t, r.id);
      if (loc && loc._dirty) continue;
      const n = Object.assign({}, r);
      if (t === 'photos') { n._up = 1; if (loc && loc.blob) n.blob = loc.blob; }
      await dbPut(t, n);
    }
    for (const loc of await dbAll(t)) {
      if (ids.has(loc.id) || loc._dirty) continue;
      if (t === 'photos' && !loc._up) continue;
      await removeLocal(t, loc);
    }
  }
}
async function purgeOld() {
  const lim = Date.now() - CFG.TRASH_DAYS * 864e5;
  for (const t of ['cars', 'bolle']) {
    for (const r of S[t].filter((x) => x.deleted_at && !x._dirty && new Date(x.deleted_at).getTime() < lim)) {
      const paths = S.photos.filter((p) => (t === 'cars' ? p.car_id : p.bolla_id) === r.id).map((p) => p.path);
      if (paths.length) await api('/storage/v1/object/' + CFG.BUCKET, { method: 'DELETE', body: { prefixes: paths } });
      await api('/rest/v1/' + t + '?id=eq.' + r.id, { method: 'DELETE' });
      await removeLocal(t, r);
    }
  }
}
let syncAgain = false;
async function sync() {
  if (!session) return;
  if (SYNC.busy) { syncAgain = true; return; }
  if (!navigator.onLine) { SYNC.err = ''; paintStatus(); return; }
  SYNC.busy = true; SYNC.err = ''; paintStatus();
  try {
    await ensureToken();
    await pushAll();
    await pullAll();
    await loadAll();
    await purgeOld();
    await loadAll();
    SYNC.last = Date.now();
  } catch (e) {
    SYNC.err = String(e.message || e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(SYNC.err)) SYNC.err = 'Connessione assente o instabile.';
  } finally {
    SYNC.busy = false;
    paintStatus(); refreshView();
    if (syncAgain) { syncAgain = false; setTimeout(sync, 300); }
  }
}

/* ---------- report PDF ---------- */
function blobToDataURL(b) { return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); }); }
async function imgSize(b) { const bm = await createImageBitmap(b); return { w: bm.width, h: bm.height }; }
async function pdfPhotos(doc, photos, st) {
  const W = 88, MAXH = 66;
  let col = 0, rowH = 0;
  for (const p of photos) {
    let b = null;
    try { b = await photoBlob(p); } catch (e) { b = null; }
    let w = W, hh = 50, data = null;
    if (b) {
      const sz = await imgSize(b); hh = W * sz.h / sz.w; w = W;
      if (hh > MAXH) { w = W * MAXH / hh; hh = MAXH; }
      data = await blobToDataURL(b);
    }
    if (st.y + hh > 280) { doc.addPage(); st.y = 15; col = 0; rowH = 0; }
    const x = 14 + col * (W + 6);
    if (data) doc.addImage(data, 'JPEG', x, st.y, w, hh);
    else { doc.setFontSize(9); doc.text('Foto non disponibile offline', x, st.y + 6); }
    rowH = Math.max(rowH, hh);
    col++;
    if (col === 2) { st.y += rowH + 5; col = 0; rowH = 0; }
  }
  if (col === 1) st.y += rowH + 5;
}
async function buildPdf(title, lines, sections) {
  if (!window.jspdf) await loadScript(CFG.JSPDF);
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const st = { y: 15 };
  try {
    const lg = await (await fetch('logo-header.png')).blob();
    doc.addImage(await blobToDataURL(lg), 'PNG', 14, 10, 14, 14);
  } catch (e) { /* senza logo */ }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(31, 42, 68);
  doc.text('Scudeletti srl', 32, 19);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(fmt(new Date().toISOString()), 196, 19, { align: 'right' });
  doc.setDrawColor(201, 162, 75); doc.setLineWidth(0.6); doc.line(14, 27, 196, 27);
  st.y = 37;
  doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(title, 14, st.y); st.y += 8;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  for (const l of lines) { const parts = doc.splitTextToSize(l, 180); doc.text(parts, 14, st.y); st.y += parts.length * 5; }
  st.y += 3;
  for (const s of sections) {
    if (st.y > 265) { doc.addPage(); st.y = 15; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(31, 42, 68);
    doc.text(s.heading, 14, st.y); st.y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20);
    if (s.text) { const parts = doc.splitTextToSize(s.text, 180); doc.text(parts, 14, st.y); st.y += parts.length * 5 + 1; }
    await pdfPhotos(doc, s.photos || [], st);
    st.y += 3;
  }
  return doc;
}

async function makeReport(kind, item) {
  const wait = overlay(h('div', { class: 'dlg' }, h('h3', null, 'Preparo il PDF…'), h('p', null, 'Con tante foto può servire qualche secondo.')), 'center', () => {});
  let doc;

  catch (e) { wait.close(); dialog({ title: 'PDF non creato', text: String(e.message || e), cancel: 'Chiudi' }); return; }
  wait.close();
  const name = kind === 'car' ? 'Scheda ' + item.vin + ' - ' + fmtFile(new Date().toISOString()) + '.pdf' : bollaFile(item);
  const file = new File([doc.output('blob')], name, { type: 'application/pdf' });
  const download = () => { const a = h('a', { href: URL.createObjectURL(file), download: name }); document.body.append(a); a.click(); a.remove(); toast('PDF salvato nel telefono'); };
  await dialog({ title: 'Report pronto', text: name, cancel: 'Chiudi', extra: [
    { label: 'Condividi (WhatsApp, email…)', fn: async () => {
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
        else download();
      } catch (e) { if (e.name !== 'AbortError') download(); }
    } },
    { label: 'Salva nel telefono', fn: download }
  ] });
}

    });
    else S.photos.filter((p) => p.damage_id === o.d.id).forEach((p) => grid.append(thumb(p, '', () => viewer(p))));
  };
  draw();
  const add = h('button', { class: 'btn full', type: 'button', onclick: async () => {
    const f = await pickPhoto(); if (!f) return;
    try {
      const pr = await prepPhoto(f);
      if (isNew) blobs.push(pr.blob); else { await addPhoto(pr.blob, 'danno', { car_id: o.d.car_id, damage_id: o.d.id }); sync(); }
      draw();
    } catch (e) { toast('Foto non riuscita'); }
  } }, ico('camera'), 'Aggiungi foto');
  let ov;
  const saveBtn = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    if (isNew) { ov.close(); await o.onDone({ note: note.trim(), blobs }); }
    else { o.d.note = note.trim() || null; stamp(o.d, false); await save('damages', o.d); ov.close(); render(); sync(); }
  } }, 'Salva');
  const del = isNew ? null : h('button', { class: 'btn danger', type: 'button', onclick: async () => {
    const r = await dialog({ title: 'Elimina danno', text: 'Il danno e le sue foto vengono eliminati.', ok: 'Elimina', danger: true });
    if (r.ok) { ov.close(); await deleteDamage(o.d); render(); }
  } }, 'Elimina');
  ov = overlay(h('div', { class: 'sheet tall' }, h('div', { class: 'sh-t' }, o.title), ta, grid, add, h('div', { class: 'dbtn' }, del, h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, 'Chiudi'), saveBtn)), 'bottom');
}

/* ---------- bolle ---------- */
async function newBolla() {
  const f = await pickPhoto(); if (!f) return;
  try {
    const pr = await prepPhoto(f);
    const b = { id: uid(), note: null }; stamp(b, true); await save('bolle', b);
    await addPhoto(pr.blob, 'bolla', { bolla_id: b.id });
    go({ name: 'bolla', id: b.id }); sync();
  } catch (e) { toast('Foto non riuscita, riprova.'); }
}
function bollaMenu(b) {
  sheet(bollaName(b), [
    { label: 'Modifica nota', icon: 'edit', fn: async () => {
      const r = await dialog({ title: 'Nota bolla', input: true, textarea: true, value: b.note || '', ok: 'Salva' });
      if (r.ok) { b.note = r.value.trim() || null; stamp(b, false); await save('bolle', b); refreshView(); sync(); }
    } },
    { label: 'Collega auto', icon: 'car', fn: () => linkCars(b) },
    { label: 'Invia report', icon: 'share', fn: () => makeReport('bolla', b) },
    { label: 'Elimina bolla', icon: 'trash', danger: true, fn: async () => {
      const r = await dialog({ title: 'Elimina bolla', text: 'Finisce nel cestino per ' + CFG.TRASH_DAYS + ' giorni.', ok: 'Elimina', danger: true,
        extra: [{ label: 'Invia il report prima', fn: () => makeReport('bolla', b) }] });
      if (!r.ok) return;
      b.deleted_at = new Date().toISOString(); stamp(b, false); await save('bolle', b);
      if (view.name === 'bolla') back(); else refreshView();
      toast('Bolla nel cestino'); sync();
    } }
  ]);
}
function linkCars(b) {
  const cars = S.cars.filter((c) => !c.deleted_at).sort((a, c) => (a.created_at < c.created_at ? 1 : -1)).slice(0, 25);
  sheet('Tocca per collegare o scollegare', cars.map((c) => ({ label: (c.bolla_id === b.id ? '✓ ' : '') + c.vin, fn: async () => {
    c.bolla_id = c.bolla_id === b.id ? null : b.id; stamp(c, false); await save('cars', c); refreshView(); sync(); linkCars(b);
  } })));
}
function bollaScreen() {
  const b = S.bolle.find((x) => x.id === view.id);
  if (!b) return [header({ back: true, title: 'Bolla' }), h('main', { class: 'main' }, h('p', { class: 'empty' }, 'Bolla non trovata.'))];
  const ph = S.photos.filter((p) => p.bolla_id === b.id).sort((a, c) => (a.created_at < c.created_at ? -1 : 1));
  const cars = S.cars.filter((c) => c.bolla_id === b.id && !c.deleted_at);
  return [header({ back: true, title: bollaName(b), right: menuBtn(() => bollaMenu(b)) }), h('div', { class: 'gold' }), h('main', { class: 'main' },
    h('div', { class: 'card' }, h('div', { class: 'meta' },
      h('div', null, fmt(b.created_at) + (b.created_by_name ? ' · ' + b.created_by_name : '')),
      b.updated_at ? h('div', null, 'Modificata il ' + fmt(b.updated_at) + (b.updated_by_name ? ' da ' + b.updated_by_name : '')) : null,
      b.numero ? null : chip('Prende il numero alla sincronizzazione', 'warn'),
      b.note ? h('div', { class: 'note' }, b.note) : null)),
    h('p', { class: 'lbl' }, 'Foto'), h('div', { class: 'grid' }, ph.map((p) => thumb(p, '', () => viewer(p)))),
    h('button', { class: 'btn full', type: 'button', onclick: async () => {
      const f = await pickPhoto(); if (!f) return;
      try { const pr = await prepPhoto(f); await addPhoto(pr.blob, 'bolla', { bolla_id: b.id }); render(); sync(); } catch (e) { toast('Foto non riuscita'); }
    } }, ico('camera'), 'Aggiungi foto'),
    h('p', { class: 'lbl' }, 'Auto collegate (' + cars.length + ')'), cars.length ? cars.map(carRow) : h('p', { class: 'empty small' }, 'Nessuna auto collegata.'),
    h('button', { class: 'btn full', type: 'button', onclick: () => linkCars(b) }, ico('car'), 'Collega auto'), h('div', { class: 'sp' })),
    h('div', { class: 'dock' }, h('button', { class: 'btn primary full lg', type: 'button', onclick: () => makeReport('bolla', b) }, ico('share'), 'Invia report'))];
}

/* ---------- cestino ---------- */
function trashScreen() {
  const left = (iso) => Math.max(0, Math.ceil((new Date(iso).getTime() + CFG.TRASH_DAYS * 864e5 - Date.now()) / 864e5));
  const items = [].concat(
    S.cars.filter((c) => c.deleted_at).map((c) => ({ t: 'cars', r: c, name: c.vin })),
    S.bolle.filter((b) => b.deleted_at).map((b) => ({ t: 'bolle', r: b, name: bollaName(b) })));
  items.sort((a, b) => (a.r.deleted_at < b.r.deleted_at ? 1 : -1));
  return [header({ back: true, title: 'Cestino' }), h('div', { class: 'gold' }), h('main', { class: 'main' },
    h('p', { class: 'hint' }, 'Gli elementi restano ' + CFG.TRASH_DAYS + ' giorni, poi vengono eliminati con le foto.'),
    items.length ? items.map((it) => h('div', { class: 'row' }, h('div', { class: 'thumbi' }, ico(it.t === 'cars' ? 'car' : 'file')),
      h('div', { class: 'grow' }, h('div', { class: 't' }, it.name), h('div', { class: 's' }, 'Eliminata il ' + fmt(it.r.deleted_at) + ' · ancora ' + left(it.r.deleted_at) + ' gg')),
      h('button', { class: 'btn', type: 'button', onclick: async () => { it.r.deleted_at = null; stamp(it.r, false); await save(it.t, it.r); render(); toast('Ripristinata'); sync(); } }, 'Ripristina')))
      : h('p', { class: 'empty' }, 'Il cestino è vuoto.'))];
}

/* ---------- disegno schermate ---------- */
function render() {
  const a = app(); if (!a) return;
  a.textContent = '';
  let parts;
  if (!session || view.name === 'login') { parts = [loginScreen()]; }
  else if (view.name === 'car') parts = carScreen();
  else if (view.name === 'newCar') parts = newCarScreen();
  else if (view.name === 'editCar') parts = editCarScreen();
  else if (view.name === 'bolla') parts = bollaScreen();
  else if (view.name === 'trash') parts = trashScreen();
  else parts = homeScreen();
  parts.forEach((p) => a.append(p));
  if (view.name === 'home' && session) renderList();
}

/* ---------- avvio ---------- */
(async function init() {
  try { await dbOpen(); await loadAll(); }
  catch (e) { document.body.textContent = 'Archivio del telefono non disponibile: ' + e.message; return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!session) view = { name: 'login' };
  else if (history.state && history.state.name && history.state.name !== 'login') view = history.state;
  history.replaceState(view, '');
  render();
  const sp = $('#splash'); if (sp) setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }, 900);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  sync();
  window.addEventListener('online', sync);
  window.addEventListener('offline', paintStatus);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  setInterval(() => { if (!document.hidden) sync(); }, 60000);
})();

</script>
</body>
</html>
