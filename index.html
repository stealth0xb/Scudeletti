const CAM = { cancel: null };
async function cameraFallback(o) {

function camera(o) {
  o = o || {};

    const shots = [];
    let stream = null, closed = false, track = null, torchOn = false, ov;
    const video = h('video', { class: 'cam-v', autoplay: '', playsinline: '' });
    video.muted = true;

    const msg = h('div', { class: 'cam-m' + (o.guide ? ' g' : '') }, o.hint || '');
    const count = h('span', { class: 'cam-n' });
    const result = () => (o.multi ? shots : null);
    const finish = (val) => {

      const s = Math.max(vr.width / c.width, vr.height / c.height);
      const x0 = (c.width - vr.width / s) / 2, y0 = (c.height - vr.height / s) / 2;
      let x = x0 + (gr.left - vr.left) / s, y = y0 + (gr.top - vr.top) / s, w = gr.width / s, hh = gr.height / s;
      x = Math.max(0, x); y = Math.max(0, y); w = Math.min(c.width - x, w); hh = Math.min(c.height - y, hh);

      const k = document.createElement('canvas'); k.width = Math.round(w); k.height = Math.round(hh);

      ov.classList.add('flash'); setTimeout(() => ov.classList.remove('flash'), 120);

    } }, ico('bolt'));
    const sys = h('button', { class: 'cam-sys', type: 'button', onclick: async () => {
      const r = await cameraFallback(o);
      if (o.multi) { if (r && r.length) { shots.push(...r); count.textContent = shots.length + ' foto'; } }
      else if (r) finish(r);
    } }, 'Fotocamera del telefono');
    ov = h('div', { class: 'cam' }, video, guide,
      h('div', { class: 'cam-top' }, h('button', { class: 'cam-i', type: 'button', 'aria-label': 'Chiudi', onclick: () => finish(result()) }, ico('x')), h('div', { class: 'cam-t' }, o.title || 'Foto'), torchBtn),
      msg,
      h('div', { class: 'cam-bot' }, o.multi ? count : sys, h('button', { class: 'cam-b', type: 'button', 'aria-label': 'Scatta', onclick: shoot }),
        o.multi ? h('button', { class: 'btn light cam-d', type: 'button', onclick: () => finish(shots) }, 'Fine') : h('span')),
      o.multi ? h('div', { class: 'cam-s2' }, sys) : null);
    document.body.append(ov);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1440 } }, audio: false })
      .then((s) => {

        stream = s; video.srcObject = s; video.play().catch(() => {});
        track = s.getVideoTracks()[0];
        try { const caps = track.getCapabilities ? track.getCapabilities() : {}; if (caps.torch) torchBtn.hidden = false; } catch (e) { /* niente */ }
      })

}

/* ---------- sincronizzazione ---------- */
const SYNC = { busy: false, err: '', last: 0 };
const pending = () => S.queue.length + TABLES.reduce((n, t) => n + S[t].filter((r) => r._dirty).length, 0);
async function pushAll() {
  for (const q of S.queue.slice()) {
    if (q.paths && q.paths.length) await api('/storage/v1/object/' + CFG.BUCKET, { method: 'DELETE', body: { prefixes: q.paths } });
    await api('/rest/v1/' + q.table + '?id=eq.' + q.rowId, { method: 'DELETE' });
    await dbDel('queue', q.id);
  }
  await reload('queue');
  for (const t of ['bolle', 'cars', 'damages']) {
    const rows = (await dbAll(t)).filter((r) => r._dirty);
    if (!rows.length) continue;
    await api('/rest/v1/' + t + '?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: rows.map((r) => pick(t, r)) });
    for (const r of rows) { const cur = await dbGet(t, r.id); if (cur && cur._rev === r._rev) { delete cur._dirty; await dbPut(t, cur); } }
  }
  for (const p of (await dbAll('photos')).filter((x) => x._dirty)) {
    if (p.blob && !p._up) {
      await api('/storage/v1/object/' + CFG.BUCKET + '/' + p.path, { method: 'POST', body: p.blob, headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' } });
      const c1 = await dbGet('photos', p.id); if (c1) { c1._up = 1; await dbPut('photos', c1); }
    }
    await api('/rest/v1/photos?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [pick('photos', p)] });
    const c2 = await dbGet('photos', p.id); if (c2 && c2._rev === p._rev) { delete c2._dirty; await dbPut('photos', c2); }
  }
  const pv = (await dbAll('preventivi')).filter((r) => r._dirty);
  if (pv.length) {
    await api('/rest/v1/preventivi?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: pv.map((r) => pick('preventivi', r)) });
    for (const r of pv) { const cur = await dbGet('preventivi', r.id); if (cur && cur._rev === r._rev) { delete cur._dirty; await dbPut('preventivi', cur); } }
  }
}
async function pullAll() {
  for (const t of TABLES) {
    let rows = [], off = 0;
    for (;;) {
      const part = await api('/rest/v1/' + t + '?select=*&order=created_at.asc&limit=1000&offset=' + off);
      rows = rows.concat(part); if (part.length < 1000) break; off += 1000;
    }
    const ids = new Set(rows.map((r) => r.id));
    for (const r of rows) {
      const loc = await dbGet(t, r.id);
      if (loc && loc._dirty) continue;
      const n = Object.assign({}, r);
      if (t === 'photos') { n._up = 1; if (loc && loc.blob) n.blob = loc.blob; }
      await dbPut(t, n);
    }
    for (const loc of await dbAll(t)) {
      if (ids.has(loc.id) || loc._dirty) continue;
      if (t === 'photos' && !loc._up) continue;
      await removeLocal(t, loc);
    }
  }
}
async function purgeOld() {
  const lim = Date.now() - CFG.TRASH_DAYS * 864e5;
  for (const t of ['cars', 'bolle', 'preventivi']) {
    for (const r of S[t].filter((x) => x.deleted_at && !x._dirty && new Date(x.deleted_at).getTime() < lim)) {
      const paths = S.photos.filter((p) => (t === 'cars' ? p.car_id : p.bolla_id) === r.id).map((p) => p.path);
      if (paths.length) await api('/storage/v1/object/' + CFG.BUCKET, { method: 'DELETE', body: { prefixes: paths } });
      await api('/rest/v1/' + t + '?id=eq.' + r.id, { method: 'DELETE' });
      await removeLocal(t, r);
    }
  }
}
let syncAgain = false;
async function sync() {
  if (!session) return;
  if (SYNC.busy) { syncAgain = true; return; }
  if (!navigator.onLine) { SYNC.err = ''; paintStatus(); return; }
  SYNC.busy = true; SYNC.err = ''; paintStatus();
  try {
    await ensureToken();
    await pushAll();
    await pullAll();
    await loadAll();
    await purgeOld();
    await loadAll();
    SYNC.last = Date.now();
  } catch (e) {
    SYNC.err = String(e.message || e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(SYNC.err)) SYNC.err = 'Connessione assente o instabile.';
  } finally {
    SYNC.busy = false;
    paintStatus(); refreshView();
    if (syncAgain) { syncAgain = false; setTimeout(sync, 300); }
  }
}

/* ---------- report PDF ---------- */
function blobToDataURL(b) { return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); }); }
async function imgSize(b) { const bm = await createImageBitmap(b); return { w: bm.width, h: bm.height }; }
async function pdfPhotos(doc, photos, st) {
  const W = 88, MAXH = 66;
  let col = 0, rowH = 0;
  for (const p of photos) {
    let b = null;
    try { b = await photoBlob(p); } catch (e) { b = null; }
    let w = W, hh = 50, data = null;
    if (b) {
      const sz = await imgSize(b); hh = W * sz.h / sz.w; w = W;
      if (hh > MAXH) { w = W * MAXH / hh; hh = MAXH; }
      data = await blobToDataURL(b);
    }
    if (st.y + hh > 280) { doc.addPage(); st.y = 15; col = 0; rowH = 0; }
    const x = 14 + col * (W + 6);
    if (data) doc.addImage(data, 'JPEG', x, st.y, w, hh);
    else { doc.setFontSize(9); doc.text('Foto non disponibile offline', x, st.y + 6); }
    rowH = Math.max(rowH, hh);
    col++;
    if (col === 2) { st.y += rowH + 5; col = 0; rowH = 0; }
  }
  if (col === 1) st.y += rowH + 5;
}
async function buildPdf(title, lines, sections) {
  if (!window.jspdf) await loadScript(CFG.JSPDF);
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const st = { y: 15 };
  try {
    const lg = await (await fetch('logo-header.png')).blob();
    doc.addImage(await blobToDataURL(lg), 'PNG', 14, 10, 14, 14);
  } catch (e) { /* senza logo */ }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(31, 42, 68);
  doc.text('Scudeletti srl', 32, 19);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(fmt(new Date().toISOString()), 196, 19, { align: 'right' });
  doc.setDrawColor(201, 162, 75); doc.setLineWidth(0.6); doc.line(14, 27, 196, 27);
  st.y = 37;
  doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(title, 14, st.y); st.y += 8;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  for (const l of lines) { const parts = doc.splitTextToSize(l, 180); doc.text(parts, 14, st.y); st.y += parts.length * 5; }
  st.y += 3;
  for (const s of sections) {
    if (st.y > 265) { doc.addPage(); st.y = 15; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(31, 42, 68);
    doc.text(s.heading, 14, st.y); st.y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20);
    if (s.text) { const parts = doc.splitTextToSize(s.text, 180); doc.text(parts, 14, st.y); st.y += parts.length * 5 + 1; }
    await pdfPhotos(doc, s.photos || [], st);
    st.y += 3;
  }
  return doc;
}

async function makeReport(kind, item) {
  const wait = overlay(h('div', { class: 'dlg' }, h('h3', null, 'Preparo il PDF…'), h('p', null, 'Con tante foto può servire qualche secondo.')), 'center', () => {});
  let doc;
  try { doc = kind === 'car' ? await carReportDoc(item) : kind === 'prev' ? await prevPdf(item) : await bollaReportDoc(item); }
  catch (e) { wait.close(); dialog({ title: 'PDF non creato', text: String(e.message || e), cancel: 'Chiudi' }); return; }
  wait.close();
  const name = kind === 'car' ? 'Scheda ' + item.vin + ' - ' + fmtFile(new Date().toISOString()) + '.pdf' : kind === 'prev' ? prevFile(item) : bollaFile(item);
  const file = new File([doc.output('blob')], name, { type: 'application/pdf' });
  const download = () => { const a = h('a', { href: URL.createObjectURL(file), download: name }); document.body.append(a); a.click(); a.remove(); toast('PDF salvato nel telefono'); };
  await dialog({ title: 'Report pronto', text: name, cancel: 'Chiudi', extra: [
    { label: 'Condividi (WhatsApp, email…)', fn: async () => {
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
        else download();
      } catch (e) { if (e.name !== 'AbortError') download(); }
    } },
    { label: 'Salva nel telefono', fn: download }
  ] });
}

async function saveDraft() {
  const vin = draft.vin.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (vin.length < 5) return toast('Scrivi il telaio (almeno 5 caratteri).');
  if (!draft.telaio) return toast('Manca la foto del telaio.');
  if (!draft.generale) return toast('Manca la foto dell\'auto.');
  if (S.cars.some((c) => !c.deleted_at && c.vin === vin)) {
    const r = await dialog({ title: 'Telaio già presente', text: 'Esiste già un\'auto con il telaio ' + vin + '. Salvare comunque?', ok: 'Salva comunque' });
    if (!r.ok) return;
  }
  const num = (draft.bollaNum || '').trim();
  if (draft.bolla && !num) {
    const r = await dialog({ title: 'Manca il numero della bolla', text: 'La bolla viene salvata senza numero. Puoi scriverlo dopo dalla sezione Bolle.', ok: 'Salva comunque', cancel: 'Torna indietro' });
    if (!r.ok) return;
  }
  let bollaId = draft.bollaId || null;
  if (!bollaId && draft.bolla) {
    let b = num ? S.bolle.find((x) => !x.deleted_at && x.numero_bolla === num) : null;
    if (!b) { b = { id: uid(), note: null, numero_bolla: num || null }; stamp(b, true); await save('bolle', b); }
    await addPhoto(draft.bolla, 'bolla', { bolla_id: b.id });
    bollaId = b.id;
  }
  if (bollaId) activeBolla = { id: bollaId, at: Date.now() };
  const car = { id: uid(), vin, status: 'arrivata', note: null, ddt: null, bolla_id: bollaId };
  stamp(car, true); await save('cars', car);
  await addPhoto(draft.telaio, 'telaio', { car_id: car.id });
  await addPhoto(draft.generale, 'generale', { car_id: car.id });
  for (const d of draft.damages) {
    const dm = { id: uid(), car_id: car.id, note: d.note || null }; stamp(dm, true); await save('damages', dm);
    for (const b of d.blobs) await addPhoto(b, 'danno', { car_id: car.id, damage_id: dm.id });
  }
  draft = null; homeTab = 'auto'; homeQ = '';
  back(); toast('Auto salvata'); sync();
}

  parts.forEach((p) => a.append(p));
  if (view.name === 'home' && session) renderList();
}

/* ---------- avvio ---------- */
(async function init() {
  try { await dbOpen(); await loadAll(); }
  catch (e) { document.body.textContent = 'Archivio del telefono non disponibile: ' + e.message; return; }
  if ('serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded && !draft && !CAM.cancel) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (!session) view = { name: 'login' };
  else if (history.state && history.state.name && history.state.name !== 'login') view = history.state;
  history.replaceState(view, '');
  render();
  const sp = $('#splash'); if (sp) setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }, 900);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  sync();
  window.addEventListener('online', sync);
  window.addEventListener('offline', paintStatus);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  setInterval(() => { if (!document.hidden) sync(); }, 60000);
})();

</script>
